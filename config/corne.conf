# Power management
CONFIG_ZMK_SLEEP=y
# 30s → idle (instant recovery)
CONFIG_ZMK_IDLE_TIMEOUT=30000
# 10min → deep sleep (keypress to wake)
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
# enables &soft_off behavior for travel
CONFIG_ZMK_PM_SOFT_OFF=y

# Bluetooth - boost TX power for better range
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Enables pointing devices (mouse, touchpad)
CONFIG_ZMK_POINTING=y
